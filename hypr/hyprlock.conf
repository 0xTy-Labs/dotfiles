background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    brightness = 0.6
    vibrancy = 0.2
}

label {
    monitor =
    text = $TIME
    color = rgba(F0F0F0ff)
    font_size = 72
    font_family = Syne Bold
    position = 0, -160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(888888ff)
    font_size = 18
    font_family = Syne
    position = 0, -90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgba(FF6B1Aff)
    inner_color = rgba(1A1A1Aff)
    font_color = rgba(F0F0F0ff)
    fail_color = rgba(FF3B3Bff)
    check_color = rgba(8FE56Dff)
    placeholder_text = Password
    hide_input = false
    position = 0, -10
    halign = center
    valign = center
    rounding = 28
    shadow_passes = 3
    shadow_size = 20
    shadow_color = rgba(000000cc)
    font_family = DM Sans
}
