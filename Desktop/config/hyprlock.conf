# axdots — config/hyprlock.conf
# ─────────────────────────────────────────────────────────────────────────────
# Hyprlock configuration.
# Linked at: ~/.config/hypr/hyprlock.conf
#   ln -sf ~/.config/axdots/config/hyprlock.conf ~/.config/hypr/hyprlock.conf
# ─────────────────────────────────────────────────────────────────────────────

# General
general {
  hide_cursor       = true
  grace             = 0       # seconds before lock actually engages
  no_fade_in        = false
}

# ── Background ────────────────────────────────────────────────────────────────

background {
  monitor     =
  path        = screenshot   # blur current screen state
  blur_passes = 3
  blur_size   = 10
  noise       = 0.02
  brightness  = 0.6
  contrast    = 0.9
}

# ── Clock — large centered display ───────────────────────────────────────────

label {
  monitor     =
  text        = cmd[update:1000] echo "$(date +"%H:%M")"
  color       = rgba(230, 237, 243, 0.95)
  font_size   = 96
  font_family = Zed Sans, Inter
  position    = 0, 180
  halign      = center
  valign      = center
}

# Date below clock
label {
  monitor     =
  text        = cmd[update:60000] echo "$(date +"%A, %B %-d")"
  color       = rgba(139, 148, 158, 0.85)
  font_size   = 22
  font_family = Zed Sans, Inter
  position    = 0, 100
  halign      = center
  valign      = center
}

# ── Auth input widget ─────────────────────────────────────────────────────────

input-field {
  monitor          =
  size             = 320, 48
  outline_thickness = 2
  dots_size        = 0.28
  dots_spacing     = 0.16
  dots_center      = true
  outer_color      = rgba(88, 166, 255, 0.6)
  inner_color      = rgba(13, 17, 23, 0.80)
  font_color       = rgba(230, 237, 243, 1.0)
  fade_on_empty    = true
  fade_timeout     = 2000
  placeholder_text = <span font_size="small" foreground="##8b949e">Enter password</span>
  hide_input       = false
  rounding         = 12
  check_color      = rgba(126, 231, 135, 1.0)
  fail_color       = rgba(249, 117, 131, 1.0)
  fail_text        = <i>Auth failed</i>
  fail_transition  = 300
  position         = 0, -100
  halign           = center
  valign           = center
}

# ── User label ────────────────────────────────────────────────────────────────

label {
  monitor     =
  text        = $USER
  color       = rgba(139, 148, 158, 0.7)
  font_size   = 14
  font_family = Zed Sans, Inter
  position    = 0, -60
  halign      = center
  valign      = center
}

# ── Battery indicator (bottom right) ─────────────────────────────────────────

label {
  monitor     =
  text        = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
  color       = rgba(139, 148, 158, 0.6)
  font_size   = 13
  font_family = Zed Sans, Inter
  position    = -20, 20
  halign      = right
  valign      = bottom
}
