# axdots — config/hypridle.conf
# ─────────────────────────────────────────────────────────────────────────────
# Link at: ~/.config/hypr/hypridle.conf
#   ln -sf ~/.config/axdots/config/hypridle.conf ~/.config/hypr/hypridle.conf
# ─────────────────────────────────────────────────────────────────────────────

general {
  lock_cmd     = pidof hyprlock || hyprlock    # don't spawn multiple
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd  = hyprctl dispatch dpms on
}

# 1. Dim screen after 2.5 min
listener {
  timeout  = 150
  on-timeout  = brightnessctl -s set 30%
  on-resume   = brightnessctl -r
}

# 2. Lock after 5 min
listener {
  timeout  = 300
  on-timeout  = loginctl lock-session
}

# 3. DPMS off after 7 min
listener {
  timeout  = 420
  on-timeout  = hyprctl dispatch dpms off
  on-resume   = hyprctl dispatch dpms on
}

# 4. Suspend after 20 min (optional — comment out if undesired)
# listener {
#   timeout  = 1200
#   on-timeout  = systemctl suspend
# }
