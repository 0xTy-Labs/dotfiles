# axdots — config/dunst.conf
# ─────────────────────────────────────────────────────────────────────────────
# Link at: ~/.config/dunst/dunstrc
#   mkdir -p ~/.config/dunst
#   ln -sf ~/.config/axdots/config/dunst.conf ~/.config/dunst/dunstrc
#
# IMPORTANT: axdots handles visual rendering of toasts itself via AGS.
# Dunst is used here as the NOTIFICATION DAEMON only (receives D-Bus signals).
# Set `show_notifications = false` so dunst doesn't render its own popups
# while AGS's AstalNotifd listens on the same bus.
# ─────────────────────────────────────────────────────────────────────────────

[global]
    # Don't render dunst popups — AGS handles display
    # Dunst still acts as the daemon and stores history
    # Use `dunstctl` for DND toggle etc.

    follow              = mouse
    width               = 1
    height              = 1
    notification_limit  = 0
    timeout             = 0
    transparency        = 100
    frame_width         = 0
    corner_radius       = 0
    idle_threshold      = 120
    sort                = yes
    indicate_hidden     = no
    shrink              = no
    mouse_left_click    = close_current
    mouse_middle_click  = do_action
    mouse_right_click   = close_all

    # Still run scripts on notifications
    script_notification = ~/.config/axdots/scripts/notif-hook.sh

[urgency_low]
    timeout = 4000

[urgency_normal]
    timeout = 6000

[urgency_critical]
    timeout = 0
