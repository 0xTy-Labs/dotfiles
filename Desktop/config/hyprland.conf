# axdots — config/hyprland.conf
# ─────────────────────────────────────────────────────────────────────────────
# Source this from your existing hyprland.conf with ONE line:
#
#   source = ~/.config/axdots/config/hyprland.conf
#
# This file ONLY adds:
#   - exec-once entries for axdots services
#   - layer rules for blur/rounding
#   - window rules for axdots overlays
#   - Keybind overrides (SUPER-prefixed, non-conflicting)
#   - Decoration enhancements for the axdots aesthetic
#
# It does NOT touch: monitors, workspaces, layouts, binds you already have.
# ─────────────────────────────────────────────────────────────────────────────

# ── Startup ───────────────────────────────────────────────────────────────────

exec-once = ags run ~/.config/axdots --instance-name axdots
exec-once = swww-daemon --no-cache
exec-once = hypridle
exec-once = dunst
exec-once = hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/axdots/scripts/wallpaper.sh --restore

# ── Decoration (blur + rounding) ─────────────────────────────────────────────
# These ENHANCE your existing decoration config — they won't break it.
# If you already have a decoration block, remove this and merge manually.

decoration {
  rounding = 12

  blur {
    enabled           = true
    size              = 8
    passes            = 2
    new_optimizations = true
    xray              = false
    noise             = 0.02
    contrast          = 0.9
    brightness        = 0.8
    popups            = true
  }

  shadow {
    enabled = true
    range   = 20
    render_power = 3
    color   = rgba(0, 0, 0, 0.5)
  }

  inactive_opacity = 0.92
  active_opacity   = 1.0
}

# ── Layer rules (axdots surfaces need blur) ───────────────────────────────────

layerrule = blur,         gtk-layer-shell
layerrule = ignorezero,   gtk-layer-shell
layerrule = xray off,     gtk-layer-shell

# Notch OVERLAY layer
layerrule = blur,         overlay
layerrule = ignorezero,   overlay

# ── Window rules ─────────────────────────────────────────────────────────────

# Float rofi
windowrule = float,    class:^(rofi)$
windowrule = stayfocused, class:^(rofi)$
windowrule = noborder, class:^(rofi)$
windowrule = noshadow, class:^(rofi)$

# Float polkit
windowrule = float, class:^(polkit-gnome-authentication-agent-1)$
windowrule = float, class:^(hyprpolkitagent)$

# Hyprpicker stays on top
windowrule = float,       class:^(hyprpicker)$
windowrule = stayfocused, class:^(hyprpicker)$

# ── Keybinds ──────────────────────────────────────────────────────────────────
# Override SUPER binds below — adjust if they conflict with your config.

$scripts = ~/.config/axdots/scripts

# App launcher (Rofi)
bind = SUPER, SPACE, exec, rofi -show drun -theme ~/.config/axdots/modules/launcher/launcher.rasi

# Notch expand/collapse
bind = SUPER, N, exec, $scripts/toggle.sh notch

# Notification center
bind = SUPER SHIFT, N, exec, $scripts/toggle.sh notifications

# Power menu
bind = SUPER SHIFT, P, exec, $scripts/toggle.sh powermenu

# Clipboard picker
bind = SUPER, V, exec, $scripts/clipboard.sh

# Emoji picker
bind = SUPER SHIFT, E, exec, $scripts/emoji.sh

# Screenshots
bind = SUPER SHIFT, S, exec, $scripts/screenshot.sh region
bind = SUPER,       Print, exec, $scripts/screenshot.sh full
bind = SUPER SHIFT, Print, exec, $scripts/screenshot.sh window
bind = SUPER CTRL,  Print, exec, $scripts/screenshot.sh freeze

# Color picker
bind = SUPER SHIFT, C, exec, hyprpicker --autocopy

# Wallpaper picker
bind = SUPER SHIFT, W, exec, $scripts/wallpaper.sh --pick

# Lock screen
bind = SUPER SHIFT, L, exec, hyprlock

# Reload axdots CSS (debug)
bind = SUPER CTRL, R, exec, $scripts/toggle.sh reload

# ── Misc Hyprland tuning for axdots aesthetic ─────────────────────────────────

animations {
  enabled = yes

  bezier = spring,  0.16, 1,    0.3, 1
  bezier = ease,    0.25, 0.46, 0.45, 0.94
  bezier = snap,    0.19, 1,    0.22, 1

  animation = windows,     1, 4,  spring
  animation = windowsOut,  1, 3,  snap,   popin 80%
  animation = windowsMove, 1, 3,  spring
  animation = border,      1, 4,  ease
  animation = fade,        1, 4,  ease
  animation = workspaces,  1, 4,  spring, slidevert
  animation = layers,      1, 3,  spring, slide
}

general {
  gaps_in       = 6
  gaps_out      = 12
  border_size   = 2
  col.active_border   = rgba(88, 166, 255, 0.8) rgba(126, 231, 135, 0.6) 45deg
  col.inactive_border = rgba(48, 54, 61, 0.6)
  layout        = dwindle
  resize_on_border = true
}

input {
  follow_mouse   = 1
  sensitivity    = 0
  touchpad {
    natural_scroll = yes
    tap-to-click   = yes
  }
}

misc {
  disable_hyprland_logo    = true
  disable_splash_rendering = true
  focus_on_activate        = true
  new_window_takes_over_fullscreen = 2
}
